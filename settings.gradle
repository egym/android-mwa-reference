pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Android MWA Example"
include ':app', ':capacitor-android', ':egym-mwa-sdk', ':egym-capacitor-mwa-navigation', ':capacitor-community-sqlite', ':capacitor-nfc-pass-wallet'
project(':capacitor-android').projectDir = new File('node_modules/@capacitor/android/capacitor')
project(':egym-mwa-sdk').projectDir = new File('node_modules/@egym-private/mwa-sdk/android')
project(':egym-capacitor-mwa-navigation').projectDir = new File('node_modules/@egym-private/capacitor-mwa-navigation/android')
project(':capacitor-community-sqlite').projectDir = new File('node_modules/@capacitor-community/sqlite/android')
project(':capacitor-nfc-pass-wallet').projectDir = new File('node_modules/@egym/capacitor-nfc-pass-wallet/android')
